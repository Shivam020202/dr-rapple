<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière Dermatology - Coming Soon</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&family=Montserrat:wght@200;300;400;500;600&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #faf8f5 0%, #f7f2ed 30%, #f0e6d8 70%, #ede0d1 100%);
            color: #5d4e37;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Luxury Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(218, 190, 160, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(205, 173, 143, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(193, 156, 126, 0.06) 0%, transparent 50%);
            z-index: -2;
        }

        /* Loading Animation */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #faf8f5 0%, #f0e6d8 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 1.2s ease-in-out 3s forwards;
        }

        .loading-logo {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 300;
            color: #8b6f47;
            margin-bottom: 2rem;
            letter-spacing: 0.2em;
            animation: luxuryGlow 2s ease-in-out infinite alternate;
        }

        .loading-animation {
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #c1846b, transparent);
            animation: luxuryBar 1.5s ease-in-out infinite;
            position: relative;
        }

        .loading-animation::before,
        .loading-animation::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, #d4a574, transparent);
        }

        .loading-animation::before {
            left: -20px;
            animation: luxuryBar 1.5s ease-in-out infinite 0.3s;
        }

        .loading-animation::after {
            right: -20px;
            animation: luxuryBar 1.5s ease-in-out infinite 0.6s;
        }

        @keyframes luxuryGlow {
            0% {
                text-shadow: 0 0 20px rgba(139, 111, 71, 0.3);
            }

            100% {
                text-shadow: 0 0 30px rgba(139, 111, 71, 0.6), 0 0 40px rgba(193, 132, 107, 0.3);
            }
        }

        @keyframes luxuryBar {

            0%,
            100% {
                transform: scaleY(0.3);
                opacity: 0.7;
            }

            50% {
                transform: scaleY(1);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Main Container */
        .container {
            opacity: 0;
            animation: luxuryFadeIn 1.5s ease-out 3.5s forwards;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Luxury Geometric Pattern */
        .geometric-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.05;
            background-image:
                linear-gradient(45deg, #8b6f47 1px, transparent 1px),
                linear-gradient(-45deg, #8b6f47 1px, transparent 1px);
            background-size: 60px 60px;
            animation: geometricShift 20s linear infinite;
        }

        @keyframes geometricShift {
            0% {
                transform: translateX(0) translateY(0);
            }

            100% {
                transform: translateX(60px) translateY(60px);
            }
        }

        /* Header */
        .header {
            padding: 4rem 3rem 2rem;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c1846b, transparent);
            animation: headerLine 2s ease-in-out 4s both;
        }

        .logo-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .logo {
            width: 140px;
            height: 140px;

            /* border-radius: 50%; */
            margin: 0 auto;
            display: flex;
            /* align-items: center; */
            /* justify-content: center; */
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: logoShine 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        @keyframes logoShine {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }

            50% {
                transform: translateX(100%) translateY(100%);
            }

            100% {
                transform: translateX(-100%) translateY(-100%);
            }
        }

        .practice-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 300;
            color: #5d4e37;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
            animation: luxurySlideUp 1.2s ease-out 4.2s both;
            text-shadow: 0 2px 4px rgba(139, 111, 71, 0.1);
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: #8b6f47;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.1em;
            animation: luxurySlideUp 1.2s ease-out 4.4s both;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            /* align-items: center; */
            justify-content: center;
            padding: 3rem;
        }

        .content-wrapper {
            text-align: center;
            max-width: 900px;
        }

        .coming-soon {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 200;
            color: #5d4e37;
            margin-bottom: 3rem;
            letter-spacing: 0.1em;
            animation: luxuryScale 1.5s ease-out 4.6s both;
            text-shadow: 0 4px 8px rgba(139, 111, 71, 0.1);
            position: relative;
        }

        .coming-soon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c1846b, transparent);
            animation: underlineGrow 1s ease-out 5.2s both;
        }

        .description {
            font-size: 1.3rem;
            line-height: 1.9;
            color: #8b6f47;
            margin-bottom: 4rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            animation: luxuryFadeIn 1.2s ease-out 4.8s both;
        }

        .luxury-divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c1846b, transparent);
            margin: 3rem auto;
            animation: dividerGrow 1s ease-out 5s both;
        }

        .services-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 3rem;
            margin-bottom: 5rem;
            animation: servicesSlide 1.5s ease-out 5.2s both;
        }

        .service-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(20px);
            padding: 3rem 2rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(193, 132, 107, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .service-card:hover::before {
            left: 100%;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(139, 111, 71, 0.25);
            border-color: rgba(193, 132, 107, 0.4);
        }

        .service-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #c1846b, #d4a574);
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 15px 40px rgba(139, 111, 71, 0.3);
        }

        .service-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 500;
            color: #5d4e37;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .service-desc {
            color: #8b6f47;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Contact Section */
        .contact-section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 100%);
            backdrop-filter: blur(30px);
            padding: 5rem 3rem;
            margin: 3rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 30px 100px rgba(139, 111, 71, 0.2);
            animation: contactSlide 1.5s ease-out 5.4s both;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-card {
            text-align: center;
            padding: 2rem;
            transition: transform 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-5px);
        }

        .contact-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #c1846b, #d4a574);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 15px 40px rgba(139, 111, 71, 0.3);
        }

        .contact-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 500;
            color: #5d4e37;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .contact-info {
            color: #8b6f47;
            font-weight: 300;
            line-height: 1.6;
        }

        .social-card {
            background: linear-gradient(135deg, #c1846b 0%, #d4a574 50%, #8b6f47 100%);
            color: white;
            border-radius: 25px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(139, 111, 71, 0.4);
            position: relative;
            overflow: hidden;
        }

        .social-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: socialShine 4s ease-in-out infinite;
        }

        .instagram-handle {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .followers-count {
            font-size: 3rem;
            font-weight: 200;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
        }

        .followers-text {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes luxuryFadeIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes luxurySlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes luxuryScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes headerLine {
            from {
                width: 0;
            }

            to {
                width: 200px;
            }
        }

        @keyframes underlineGrow {
            from {
                width: 0;
            }

            to {
                width: 120px;
            }
        }

        @keyframes dividerGrow {
            from {
                width: 0;
            }

            to {
                width: 100px;
            }
        }

        @keyframes servicesSlide {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes contactSlide {
            from {
                opacity: 0;
                transform: translateY(60px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes socialShine {
            0% {
                transform: translateX(-100%) translateY(-100%);
            }

            50% {
                transform: translateX(100%) translateY(100%);
            }

            100% {
                transform: translateX(-100%) translateY(-100%);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .coming-soon {
                font-size: 3.5rem;
            }

            .practice-name {
                font-size: 2.8rem;
            }

            .description {
                font-size: 1.1rem;
            }

            .services-preview {
                grid-template-columns: 1fr;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 3rem 2rem 1rem;
            }

            .main-content {
                padding: 2rem;
            }

            .contact-section {
                margin: 2rem 1rem;
                padding: 3rem 2rem;
            }
        }

        @media (max-width: 480px) {
            .coming-soon {
                font-size: 2.5rem;
            }

            .practice-name {
                font-size: 2.2rem;
            }

            .logo {
                width: 100px;
                height: 100px;
                font-size: 2rem;
            }
        }

        .profile-container {
            max-width: 935px;
            background: black;
            border-radius: 20px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 44px;
        }

        /* Profile Picture */
        .profile-picture-container {
            flex-shrink: 0;
        }

        .profile-picture {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-picture img {
            width: 178px;
            height: 178px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #000000;
        }

        .profile-picture-placeholder {
            width: 174px;
            height: 174px;
            border-radius: 50%;
            background-color: #262626;
            border: 3px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e8e;
            font-size: 14px;
        }

        /* Profile Info */
        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .username-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .username {
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
        }

        .verified-badge {
            width: 18px;
            height: 18px;
            background-color: #1da1f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .follow-btn {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .follow-btn:hover {
            background-color: #0084e6;
        }

        .message-btn {
            background-color: #363636;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .message-btn:hover {
            background-color: #404040;
        }

        .more-options {
            background-color: #363636;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .more-options:hover {
            background-color: #404040;
        }

        .dots-menu {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stats */
        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .stat {
            text-align: left;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .stat-label {
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
        }

        /* Bio */
        .profile-bio {
            max-width: 350px;
        }

        .bio-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .bio-category {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 8px;
        }

        .bio-text {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.4;
        }

        .bio-text .medal {
            font-size: 16px;
        }

        .bio-text .more-link {
            color: #8e8e8e;
            text-decoration: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .profile-container {
                padding: 20px 16px;
            }

            .profile-header {
                gap: 20px;
                margin-bottom: 30px;
            }

            .profile-picture {
                width: 80px;
                height: 80px;
                padding: 2px;
            }

            .profile-picture img,
            .profile-picture-placeholder {
                width: 76px;
                height: 76px;
                border: 2px solid #000000;
            }

            .username {
                font-size: 24px;
            }

            .profile-header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .action-buttons {
                width: 100%;
            }

            .follow-btn,
            .message-btn {
                flex: 1;
                padding: 8px 16px;
            }

            .profile-stats {
                gap: 20px;
                justify-content: space-around;
                width: 100%;
            }

            .stat {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .profile-stats {
                gap: 10px;
            }

            .stat-number,
            .stat-label {
                font-size: 14px;
            }

            .username {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-logo">Dr Rapple</div>
        <div class="loading-animation"></div>
    </div>

    <!-- Geometric Overlay -->
    <div class="geometric-overlay"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <div class="logo"><img
                        src="https://newoaks.s3.us-west-1.amazonaws.com/AutoDev/17785/8c243142-d258-49e5-a3fa-2f953fce9b7a.png"
                        alt=""></div>
            </div>
            <h1 class="practice-name">Dr. Rapple Dermatology</h1>
            <p class="tagline">Where Science Meets Artistry</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <h2 class="coming-soon">Coming Soon</h2>
                <p class="description">
                    Prepare to experience the pinnacle of dermatological excellence. Our exclusive practice combines
                    cutting-edge medical expertise with luxurious treatments, creating an unparalleled journey to your
                    most radiant self.
                </p>

                <div class="luxury-divider"></div>


            </div>

        </main>


    </div>
</body>

</html>
